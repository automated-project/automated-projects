name: Render and Upload to YouTube (Master Pipeline)

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'YouTube/02_Velvet_Sunset_Channel/**'
      - 'YouTube/shared/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  render-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 最大6時間まで許可

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install FFmpeg & System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-freefont-ttf

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth-oauthlib google-auth-httplib2 pillow numpy pydub librosa

      - name: Restore YouTube Tokens from Secrets
        env:
          YOUTUBE_CLIENT_SECRET_BASE64: ${{ secrets.YOUTUBE_CLIENT_SECRET_BASE64 }}
          YOUTUBE_TOKEN_CHILL_BASE64: ${{ secrets.YOUTUBE_TOKEN_CHILL_BASE64 }}
          YOUTUBE_TOKEN_VELVET_BASE64: ${{ secrets.YOUTUBE_TOKEN_VELVET_BASE64 }}
          YOUTUBE_TOKEN_UPLIFTING_BASE64: ${{ secrets.YOUTUBE_TOKEN_UPLIFTING_BASE64 }}
        run: |
          mkdir -p YouTube/shared/credentials
          if [ -n "$YOUTUBE_CLIENT_SECRET_BASE64" ]; then
            echo "$YOUTUBE_CLIENT_SECRET_BASE64" | base64 -d > YouTube/shared/credentials/client_secrets.json
          fi
          if [ -n "$YOUTUBE_TOKEN_CHILL_BASE64" ]; then
            echo "$YOUTUBE_TOKEN_CHILL_BASE64" | base64 -d > YouTube/shared/credentials/token_gameverse.json
          fi
          if [ -n "$YOUTUBE_TOKEN_VELVET_BASE64" ]; then
            echo "$YOUTUBE_TOKEN_VELVET_BASE64" | base64 -d > YouTube/shared/credentials/token_phonkforge.json
          fi
          if [ -n "$YOUTUBE_TOKEN_UPLIFTING_BASE64" ]; then
            echo "$YOUTUBE_TOKEN_UPLIFTING_BASE64" | base64 -d > YouTube/shared/credentials/token_auramelody.json
          fi

      - name: Execute Master Video Pipeline (Ch2 Cloud Render & YouTube Upload)
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python YouTube/shared/scripts/master_video_pipeline.py --channel ch2 --step all --mode cloud_actions

      - name: Clean Up Temporary Credentials
        if: always()
        run: |
          rm -rf YouTube/shared/credentials/*.json
