name: Render and Upload to YouTube (Modular Master Pipeline)

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'YouTube/02_Velvet_Sunset_Channel/**'
      - 'YouTube/shared/**'
      - '.github/workflows/**'
      - 'requirements.txt'
  workflow_dispatch:

jobs:
  render-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 最大6時間まで許可

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install FFmpeg & System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-freefont-ttf

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Restore YouTube Tokens from Secrets (Robust Python Decoder)
        env:
          YOUTUBE_CLIENT_SECRET_BASE64: ${{ secrets.YOUTUBE_CLIENT_SECRET_BASE64 }}
          YOUTUBE_TOKEN_CHILL_BASE64: ${{ secrets.YOUTUBE_TOKEN_CHILL_BASE64 }}
          YOUTUBE_TOKEN_VELVET_BASE64: ${{ secrets.YOUTUBE_TOKEN_VELVET_BASE64 }}
          YOUTUBE_TOKEN_UPLIFTING_BASE64: ${{ secrets.YOUTUBE_TOKEN_UPLIFTING_BASE64 }}
        run: |
          python -c "
          import os, base64, pathlib
          cred_dir = pathlib.Path('YouTube/shared/credentials')
          cred_dir.mkdir(parents=True, exist_ok=True)
          
          mapping = {
              'YOUTUBE_CLIENT_SECRET_BASE64': 'client_secrets.json',
              'YOUTUBE_TOKEN_CHILL_BASE64': 'token_gameverse.json',
              'YOUTUBE_TOKEN_VELVET_BASE64': 'token_phonkforge.json',
              'YOUTUBE_TOKEN_UPLIFTING_BASE64': 'token_auramelody.json'
          }
          
          for env_key, filename in mapping.items():
              val = os.getenv(env_key, '').strip()
              if val:
                  try:
                      decoded = base64.b64decode(val).decode('utf-8')
                      target = cred_dir / filename
                      target.write_text(decoded, encoding='utf-8')
                      print(f'✅ Restored {filename}')
                  except Exception as e:
                      print(f'⚠️ Failed restoring {filename}: {e}')
          "

      - name: Execute Modular Master Pipeline (Ch2 Cloud Render & YouTube Upload)
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: "${{ github.workspace }}/YouTube:${{ github.workspace }}"
        run: |
          python YouTube/shared/scripts/run_pipeline.py --config YouTube/02_Velvet_Sunset_Channel/templates/config.json --step all --cloud

      - name: Clean Up Temporary Credentials
        if: always()
        run: |
          rm -rf YouTube/shared/credentials/*.json
